name: Publish bridge to npm

on:
  push:
    tags:
      - 'bridge-v*'

permissions:
  contents: read

concurrency:
  group: publish-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: Stage bridge release
    runs-on: ubuntu-latest
    environment:
      name: npm-bridge
      url: https://www.npmjs.com/package/@dcat-toolkit/bridge
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Do not set registry-url: setup-node would write an .npmrc authToken and
      # export a placeholder NODE_AUTH_TOKEN, which makes npm choose token auth
      # instead of the OIDC identity used by trusted publishing.
      - name: Set up Node and npm
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      # Staged publishing requires npm 11.15.0 or newer. CI never uses a token.
      - name: Install npm with staged publishing support
        run: |
          npm install --global 'npm@^11.15.0'
          node --version
          npm --version

      - name: Verify tag matches bridge version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#bridge-v}"
          PACKAGE_VERSION="$(node -p "require('./packages/bridge/package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match bridge package version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: |
          npm run typecheck
          npm test
          npm run build:bridge

      - name: Stage package for maintainer approval
        working-directory: packages/bridge
        run: |
          unset NODE_AUTH_TOKEN || true
          npm stage publish --tag latest
